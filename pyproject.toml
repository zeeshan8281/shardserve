[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shardserve"
version = "0.2.0"
description = "Retrieval-aware custom Qwen tensor-parallel inference"
requires-python = ">=3.9"
dependencies = ["torch==2.8.0", "transformers==4.57.6", "safetensors==0.7.0", "huggingface-hub==0.36.2"]

[project.optional-dependencies]
cuda = ["triton==3.4.0; sys_platform == 'linux'"]
databricks = ["mlflow==3.3.2"]

[project.scripts]
shardserve = "shardserve.cli:main"

[tool.setuptools.packages.find]
include = ["shardserve*"]
